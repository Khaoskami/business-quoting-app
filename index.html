<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Business Quotes</title>
<link rel="manifest" href="/manifest.json" />
<meta name="theme-color" content="#faf8f5" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="description" content="Create professional business quotes. Private, encrypted, works offline." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,400&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --font-main: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  --font-mono: 'DM Mono', 'Courier New', monospace;
  --font-size-xs: 11px;
  --font-size-sm: 13px;
  --font-size-base: 15px;
  --font-size-md: 16px;
  --font-size-lg: 20px;
  --font-size-xl: 26px;
  --font-size-2xl: 32px;
  --line-height: 1.65;
  --letter-spacing: 0.01em;

  /* Surfaces */
  --bg:             #faf8f5;
  --bg-warm:        #f5f0eb;
  --surface:        #ffffff;
  --surface-raised: #fffefb;
  --surface-sunken: #f0ece6;

  /* Borders */
  --border:         #e8e2da;
  --border-strong:  #c8c0b6;
  --border-focus:   #9a8a7a;

  /* Text */
  --text:           #1e2430;
  --text-secondary: #6b7280;
  --text-tertiary:  #9ca3af;
  --text-inverse:   #ffffff;

  /* Brand */
  --brand:          #3b6b8a;
  --brand-hover:    #2d5570;
  --brand-light:    #e8f1f7;
  --brand-muted:    #d0e4f0;

  /* Semantic */
  --success:        #4a8c6f;
  --success-bg:     #eef7f0;
  --warning:        #c07a30;
  --warning-bg:     #fdf3e8;
  --danger:         #c0564f;
  --danger-bg:      #fdf0ef;
  --accent:         #7c6db0;
  --accent-bg:      #f3f0f8;

  /* Tier badges */
  --tier-free:      #9ca3af;
  --tier-pro:       var(--brand);
  --tier-business:  var(--accent);

  /* Layout */
  --radius-sm:      6px;
  --radius:         10px;
  --radius-lg:      14px;
  --radius-xl:      20px;
  --shadow-sm:      0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow:         0 4px 12px rgba(0,0,0,0.08), 0 2px 4px rgba(0,0,0,0.04);
  --shadow-lg:      0 12px 32px rgba(0,0,0,0.10), 0 4px 8px rgba(0,0,0,0.06);
  --transition:     150ms cubic-bezier(0.16, 1, 0.3, 1);
}

html, body, #root { height: 100%; }

body {
  font-family: var(--font-main);
  background: var(--bg);
  color: var(--text);
  line-height: var(--line-height);
  letter-spacing: var(--letter-spacing);
  font-size: var(--font-size-base);
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
}

button, input, select, textarea { font-family: inherit; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }
::-webkit-scrollbar-thumb:hover { background: var(--border-strong); }

:focus-visible {
  outline: 2px solid var(--brand);
  outline-offset: 2px;
  border-radius: var(--radius-sm);
}

/* ===== APP SHELL ===== */
.app-shell {
  display: grid;
  grid-template-columns: 220px 1fr;
  min-height: 100vh;
}
.sidebar {
  background: var(--surface);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 20px 12px;
  position: sticky;
  top: 0;
  height: 100vh;
  overflow-y: auto;
  gap: 4px;
}
.main-content {
  background: var(--bg);
  padding: 32px;
  overflow-y: auto;
  min-width: 0;
}
.page-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  flex-wrap: wrap;
  margin-bottom: 24px;
}
.page-title {
  font-size: var(--font-size-2xl);
  font-weight: 600;
  letter-spacing: -0.01em;
  color: var(--text);
}
.page-enter { animation: fadeSlideIn 180ms cubic-bezier(0.16, 1, 0.3, 1) forwards; }
@keyframes fadeSlideIn {
  from { opacity: 0; transform: translateY(6px); }
  to   { opacity: 1; transform: translateY(0); }
}

/* ===== SIDEBAR ===== */
.sidebar-brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 4px 8px 16px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 12px;
}
.brand-mark {
  width: 32px; height: 32px;
  border-radius: 8px;
  background: var(--brand);
  color: white;
  font-weight: 600;
  display: grid; place-items: center;
  flex-shrink: 0;
  font-size: 13px;
}
.brand-name { font-size: var(--font-size-sm); font-weight: 600; color: var(--text); line-height: 1.2; }
.brand-sub { font-size: var(--font-size-xs); color: var(--text-secondary); margin-top: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 150px; }
.sidebar-nav { display: flex; flex-direction: column; gap: 2px; }
.sidebar-footer {
  margin-top: auto;
  display: flex; flex-direction: column; gap: 2px;
  padding-top: 12px;
  border-top: 1px solid var(--border);
}
.sidebar-footer .tier-badge { margin: 4px 4px 8px; }

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  width: 100%;
  padding: 9px 12px;
  min-height: 38px;
  border: none;
  border-radius: var(--radius);
  background: transparent;
  color: var(--text-secondary);
  font-size: var(--font-size-sm);
  font-weight: 500;
  cursor: pointer;
  transition: background var(--transition), color var(--transition);
  text-align: left;
}
.nav-item svg { width: 18px; height: 18px; flex-shrink: 0; }
.nav-item:hover { background: var(--bg-warm); color: var(--text); }
.nav-item.active { background: var(--brand-light); color: var(--brand); }
.nav-item--danger:hover { background: var(--danger-bg); color: var(--danger); }

/* ===== BOTTOM NAV (mobile) ===== */
.bottom-nav {
  display: none;
  position: fixed;
  bottom: 0; left: 0; right: 0;
  background: var(--surface);
  border-top: 1px solid var(--border);
  padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
  z-index: 50;
}
.bottom-nav-inner { display: grid; grid-template-columns: repeat(4, 1fr); }
.bottom-nav-item {
  display: flex; flex-direction: column;
  align-items: center; gap: 3px;
  padding: 6px 4px;
  border: none; background: none;
  color: var(--text-tertiary);
  font-size: 10px; font-weight: 500;
  cursor: pointer;
  min-height: 44px;
  justify-content: center;
}
.bottom-nav-item svg { width: 20px; height: 20px; }
.bottom-nav-item.active { color: var(--brand); }

.mobile-bar {
  display: none;
  position: sticky; top: 0; z-index: 30;
  background: var(--surface);
  border-bottom: 1px solid var(--border);
  padding: 12px 16px;
  align-items: center;
  justify-content: space-between;
}
.mobile-bar .brand-name { font-size: var(--font-size-md); }
.mobile-bar-actions { display: flex; gap: 6px; align-items: center; }

@media (max-width: 768px) {
  .app-shell { grid-template-columns: 1fr; grid-template-rows: auto 1fr; }
  .sidebar { display: none; }
  .bottom-nav { display: block; }
  .mobile-bar { display: flex; }
  .main-content { padding: 16px; padding-bottom: calc(80px + env(safe-area-inset-bottom)); }
  .page-title { font-size: var(--font-size-xl); }
}

/* ===== CARDS ===== */
.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px 24px;
}
.card--raised { box-shadow: var(--shadow-sm); }
.card--flat { background: var(--bg-warm); border-color: transparent; }

/* ===== BUTTONS ===== */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  padding: 9px 16px;
  min-height: 38px;
  border-radius: var(--radius);
  font-size: var(--font-size-sm);
  font-weight: 500;
  border: none;
  cursor: pointer;
  transition: background var(--transition), color var(--transition), transform var(--transition), border-color var(--transition);
  white-space: nowrap;
  -webkit-tap-highlight-color: transparent;
  color: var(--text);
  background: var(--surface);
}
.btn--primary { background: var(--brand); color: var(--text-inverse); }
.btn--primary:hover { background: var(--brand-hover); }
.btn--secondary {
  background: var(--surface);
  color: var(--text);
  border: 1px solid var(--border-strong);
}
.btn--secondary:hover { background: var(--bg-warm); }
.btn--ghost { background: transparent; color: var(--text-secondary); }
.btn--ghost:hover { background: var(--bg-warm); color: var(--text); }
.btn--danger {
  background: var(--danger-bg);
  color: var(--danger);
  border: 1px solid transparent;
}
.btn--danger:hover { background: var(--danger); color: white; }
.btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }
.btn:active:not(:disabled) { transform: scale(0.97); }
.btn--sm { padding: 6px 12px; min-height: 30px; font-size: var(--font-size-xs); }
.btn--lg { padding: 12px 24px; min-height: 44px; font-size: var(--font-size-md); }
.btn--full { width: 100%; }
.btn--loading { position: relative; color: transparent; }
.btn--loading::after {
  content: ''; position: absolute;
  width: 14px; height: 14px;
  border: 2px solid currentColor; border-top-color: transparent;
  border-radius: 50%;
  animation: spin 0.6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }

/* ===== FORMS ===== */
.field-group { display: flex; flex-direction: column; gap: 6px; }
.field-group--span { grid-column: 1 / -1; }
.field-label {
  font-size: var(--font-size-xs);
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
}
.field-input, .field-select, .field-textarea {
  width: 100%;
  padding: 10px 14px;
  min-height: 40px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  background: var(--surface);
  color: var(--text);
  font-size: var(--font-size-base);
  transition: border-color var(--transition), box-shadow var(--transition);
  -webkit-appearance: none;
}
.field-textarea { resize: vertical; min-height: 80px; }
.field-input:hover, .field-select:hover { border-color: var(--border-strong); }
.field-input:focus, .field-select:focus, .field-textarea:focus {
  outline: none;
  border-color: var(--border-focus);
  box-shadow: 0 0 0 3px var(--brand-muted);
}
.field-input::placeholder { color: var(--text-tertiary); }
.field-hint { font-size: var(--font-size-xs); color: var(--text-tertiary); }
.field-error { font-size: var(--font-size-xs); color: var(--danger); }

.form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
@media (max-width: 560px) {
  .form-grid { grid-template-columns: 1fr; }
}

/* ===== BADGES ===== */
.badge {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: 20px;
  letter-spacing: 0.02em;
  text-transform: uppercase;
}
.badge::before {
  content: '';
  width: 5px; height: 5px;
  border-radius: 50%;
  background: currentColor;
}
.badge--draft    { background: var(--surface-sunken); color: var(--text-secondary); }
.badge--sent     { background: var(--warning-bg);     color: var(--warning); }
.badge--accepted { background: var(--success-bg);     color: var(--success); }
.badge--declined { background: var(--danger-bg);      color: var(--danger); }
.badge--expired  { background: var(--surface-sunken); color: var(--text-secondary); }
.badge--invoiced { background: var(--brand-light);    color: var(--brand); }

.tier-badge {
  display: inline-flex; align-items: center; gap: 6px;
  font-size: var(--font-size-xs); font-weight: 600;
  padding: 4px 10px; border-radius: 20px;
  background: var(--surface-sunken); color: var(--text-secondary);
}
.tier-badge--pro { background: var(--brand-light); color: var(--brand); }
.tier-badge--business { background: var(--accent-bg); color: var(--accent); }

/* ===== STATS ===== */
.stat-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
  gap: 12px;
  margin-bottom: 24px;
}
.stat-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-top: 3px solid var(--brand);
  border-radius: var(--radius-lg);
  padding: 18px 20px;
  display: flex; flex-direction: column; gap: 6px;
}
.stat-card--warning  { border-top-color: var(--warning); }
.stat-card--success  { border-top-color: var(--success); }
.stat-card--accent   { border-top-color: var(--accent); }
.stat-icon { color: var(--text-tertiary); }
.stat-value { font-size: 28px; font-weight: 600; color: var(--text); line-height: 1.1; letter-spacing: -0.02em; }
.stat-label {
  font-size: var(--font-size-xs);
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  font-weight: 500;
}

/* ===== LIST ===== */
.list { display: flex; flex-direction: column; }
.list-header {
  display: grid;
  grid-template-columns: 90px 1fr 1fr 110px 110px 110px;
  gap: 12px;
  padding: 10px 16px;
  font-size: var(--font-size-xs);
  font-weight: 600;
  color: var(--text-secondary);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  border-bottom: 1px solid var(--border);
}
.list-row {
  display: grid;
  grid-template-columns: 90px 1fr 1fr 110px 110px 110px;
  gap: 12px;
  padding: 14px 16px;
  align-items: center;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background var(--transition);
  font-size: var(--font-size-sm);
}
.list-row:hover { background: var(--bg-warm); }
.list-row .num { color: var(--text-tertiary); font-family: var(--font-mono); font-size: var(--font-size-xs); }
.list-row .title { font-weight: 500; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-row .client { color: var(--text-secondary); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.list-row .date { color: var(--text-secondary); }
.list-row .value { font-family: var(--font-mono); font-weight: 500; color: var(--text); }

@media (max-width: 768px) {
  .list-header { display: none; }
  .list-row {
    grid-template-columns: 1fr auto;
    grid-template-areas: "title value" "client date" "client status";
    row-gap: 4px;
  }
  .list-row .num { display: none; }
  .list-row .title { grid-area: title; }
  .list-row .client { grid-area: client; }
  .list-row .date { grid-area: date; text-align: right; font-size: var(--font-size-xs); }
  .list-row .value { grid-area: value; text-align: right; }
  .list-row .status-cell { grid-area: status; justify-self: end; }
}

/* Card-style list (clients, catalog) */
.simple-list { display: flex; flex-direction: column; gap: 6px; }
.simple-row {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px;
  padding: 14px 16px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  transition: background var(--transition), border-color var(--transition);
}
.simple-row:hover { background: var(--surface-raised); border-color: var(--border-strong); }
.simple-row .name { font-weight: 500; color: var(--text); }
.simple-row .meta { font-size: var(--font-size-xs); color: var(--text-secondary); margin-top: 2px; }
.simple-row-actions { display: flex; gap: 4px; flex-shrink: 0; }

/* ===== EMPTY ===== */
.empty-state {
  display: flex; flex-direction: column;
  align-items: center; gap: 12px;
  padding: 64px 24px;
  text-align: center;
  color: var(--text-secondary);
}
.empty-state svg { color: var(--text-tertiary); margin-bottom: 4px; }
.empty-state h3 { font-size: var(--font-size-lg); font-weight: 500; color: var(--text); }
.empty-state p { font-size: var(--font-size-sm); max-width: 320px; }

/* ===== EDITOR ===== */
.editor-shell {
  display: grid;
  grid-template-columns: 1fr 320px;
  gap: 24px;
  align-items: start;
}
@media (max-width: 1024px) {
  .editor-shell { grid-template-columns: 1fr; }
}
.editor-main { display: flex; flex-direction: column; gap: 20px; min-width: 0; }
.totals-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 20px;
  position: sticky;
  top: 24px;
  display: flex; flex-direction: column; gap: 12px;
}
.totals-row {
  display: flex; justify-content: space-between;
  padding: 4px 0;
  font-size: var(--font-size-sm);
  color: var(--text-secondary);
}
.totals-row .totals-value { font-family: var(--font-mono); color: var(--text); }
.totals-row.grand {
  font-size: var(--font-size-lg);
  font-weight: 600;
  color: var(--text);
  border-top: 1px solid var(--border);
  padding-top: 12px;
  margin-top: 4px;
}
.totals-row.grand .totals-value { color: var(--text); font-weight: 600; }
.totals-row.discount .totals-value { color: var(--danger); }

.line-items { display: flex; flex-direction: column; gap: 8px; }
.line-items-header {
  display: grid;
  grid-template-columns: 1fr 70px 110px 110px 32px;
  gap: 8px;
  font-size: var(--font-size-xs);
  color: var(--text-secondary);
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  padding: 0 12px;
}
.line-items-row {
  display: grid;
  grid-template-columns: 1fr 70px 110px 110px 32px;
  gap: 8px;
  align-items: center;
  background: var(--bg-warm);
  border: 1px solid transparent;
  border-radius: var(--radius);
  padding: 8px 12px;
  transition: border-color var(--transition);
}
.line-items-row:focus-within { border-color: var(--border-focus); background: var(--surface); }
.line-items-row .li-input {
  background: transparent; border: none; padding: 6px 0;
  font-size: var(--font-size-sm); color: var(--text); width: 100%;
}
.line-items-row .li-input:focus { outline: none; }
.line-items-row .li-input--num { font-family: var(--font-mono); text-align: right; }
.line-items-row .li-total { font-family: var(--font-mono); font-size: var(--font-size-sm); color: var(--text); text-align: right; font-weight: 500; }
.line-items-row .li-remove {
  background: none; border: none; cursor: pointer;
  color: var(--text-tertiary); font-size: 18px; padding: 4px;
  border-radius: 4px;
}
.line-items-row .li-remove:hover:not(:disabled) { color: var(--danger); background: var(--danger-bg); }
.line-items-row .li-remove:disabled { opacity: 0.3; cursor: not-allowed; }
@media (max-width: 640px) {
  .line-items-header { display: none; }
  .line-items-row {
    grid-template-columns: 1fr 32px;
    grid-template-areas: "desc remove" "qty price" "total total";
    row-gap: 6px;
  }
}

.catalog-drawer {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 16px;
  max-height: 320px;
  overflow-y: auto;
}
.catalog-pick {
  display: flex; justify-content: space-between; align-items: center;
  padding: 8px 12px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  font-size: var(--font-size-sm);
}
.catalog-pick:hover { background: var(--bg-warm); }
.catalog-pick .price { color: var(--text-secondary); font-family: var(--font-mono); }

/* ===== LOCK SCREEN ===== */
.lock-screen {
  min-height: 100vh;
  display: grid;
  place-items: center;
  background: var(--bg);
  padding: 24px;
}
.lock-card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: var(--radius-xl);
  padding: 48px 40px 40px;
  width: 100%;
  max-width: 380px;
  box-shadow: var(--shadow-lg);
}
.lock-logo {
  width: 48px; height: 48px;
  border-radius: var(--radius-lg);
  background: var(--brand);
  color: white;
  margin: 0 auto 24px;
  display: grid; place-items: center;
  font-size: 22px; font-weight: 600;
}
.lock-title {
  font-size: var(--font-size-xl);
  font-weight: 600;
  text-align: center;
  margin-bottom: 6px;
  color: var(--text);
  letter-spacing: -0.01em;
}
.lock-subtitle {
  font-size: var(--font-size-sm);
  color: var(--text-secondary);
  text-align: center;
  margin-bottom: 24px;
  line-height: 1.5;
}
.lock-tabs {
  display: grid; grid-template-columns: 1fr 1fr;
  background: var(--surface-sunken);
  border-radius: var(--radius);
  padding: 4px;
  margin-bottom: 20px;
  gap: 4px;
}
.lock-tab {
  background: transparent; border: none; cursor: pointer;
  padding: 8px 12px;
  font-size: var(--font-size-sm); font-weight: 500;
  color: var(--text-secondary);
  border-radius: calc(var(--radius) - 4px);
  transition: background var(--transition), color var(--transition);
}
.lock-tab.active { background: var(--surface); color: var(--text); box-shadow: var(--shadow-sm); }

/* ===== MODAL ===== */
.modal-overlay {
  position: fixed; inset: 0;
  background: rgba(0,0,0,0.35);
  display: grid; place-items: center;
  padding: 24px; z-index: 100;
  backdrop-filter: blur(2px);
}
.modal {
  background: var(--surface);
  border-radius: var(--radius-xl);
  width: 100%;
  max-width: 440px;
  box-shadow: var(--shadow-lg);
  border: 1px solid var(--border);
}
.modal-header {
  display: flex; justify-content: space-between; align-items: center;
  padding: 20px 24px;
  border-bottom: 1px solid var(--border);
}
.modal-header h2 { font-size: var(--font-size-md); font-weight: 600; }
.modal-body { padding: 20px 24px; font-size: var(--font-size-sm); color: var(--text-secondary); }
.modal-body p { margin-bottom: 8px; }
.modal-footer {
  display: flex; justify-content: flex-end; gap: 8px;
  padding: 16px 24px;
  border-top: 1px solid var(--border);
}

/* ===== TIER CARDS ===== */
.tier-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
  gap: 12px;
}
.tier-card {
  border: 2px solid var(--border);
  border-radius: var(--radius-lg);
  padding: 18px;
  background: var(--surface);
  transition: border-color var(--transition), transform var(--transition);
  display: flex; flex-direction: column; gap: 8px;
  text-align: left;
  cursor: pointer;
  font: inherit;
}
.tier-card:hover { border-color: var(--border-strong); }
.tier-card.active { border-color: var(--brand); background: var(--brand-light); }
.tier-card h4 { font-size: var(--font-size-md); font-weight: 600; }
.tier-card .price { font-size: var(--font-size-sm); color: var(--text-secondary); }
.tier-card ul { list-style: none; font-size: var(--font-size-xs); color: var(--text-secondary); margin-top: 6px; line-height: 1.8; }

/* ===== TOAST ===== */
.toast {
  position: fixed;
  top: 20px; right: 20px;
  background: var(--text);
  color: var(--text-inverse);
  padding: 12px 16px;
  border-radius: var(--radius);
  font-size: var(--font-size-sm);
  font-weight: 500;
  box-shadow: var(--shadow-lg);
  animation: toastIn 200ms cubic-bezier(0.16, 1, 0.3, 1) forwards;
  z-index: 200;
  max-width: 320px;
}
.toast--success { background: var(--success); }
.toast--error   { background: var(--danger); }
.toast--warning { background: var(--warning); }
@keyframes toastIn {
  from { opacity: 0; transform: translateX(12px); }
  to   { opacity: 1; transform: translateX(0); }
}

/* ===== USAGE METER ===== */
.meter { margin-bottom: 16px; }
.meter-head { display: flex; justify-content: space-between; align-items: center; font-size: var(--font-size-xs); color: var(--text-secondary); margin-bottom: 6px; }
.meter-track { height: 4px; background: var(--surface-sunken); border-radius: 2px; overflow: hidden; }
.meter-fill { height: 100%; background: var(--brand); border-radius: 2px; transition: width var(--transition); }
.meter-fill--warn { background: var(--warning); }
.meter-fill--over { background: var(--danger); }

/* ===== UPGRADE BANNER ===== */
.upgrade-banner {
  background: var(--accent-bg);
  border: 1px solid var(--accent);
  border-left-width: 4px;
  border-radius: var(--radius);
  padding: 14px 16px;
  margin-bottom: 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 12px;
  flex-wrap: wrap;
}
.upgrade-banner-title { font-size: var(--font-size-sm); font-weight: 600; color: var(--accent); }
.upgrade-banner-sub { font-size: var(--font-size-xs); color: var(--text-secondary); margin-top: 2px; }

/* ===== SECTION ===== */
.section-title {
  font-size: var(--font-size-md);
  font-weight: 600;
  margin: 24px 0 12px;
  color: var(--text);
}
.section-title:first-child { margin-top: 0; }

.action-bar { display: flex; gap: 8px; flex-wrap: wrap; }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after {
    animation-duration: 0.01ms !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
</head>
